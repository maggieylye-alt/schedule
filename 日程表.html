/* ============ ICS loader ============ */
async function loadICS(url) {
  const status = document.getElementById('icsStatus');
  if (!url) { status.textContent = '请填写订阅链接'; status.className = 'ics-status err'; return; }
  status.textContent = '加载中…'; status.className = 'ics-status';
  let httpUrl = url.trim().replace(/^webcal:/, 'https:');
  const proxies = [
    `https://corsproxy.io/?${encodeURIComponent(httpUrl)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(httpUrl)}`,
    httpUrl
  ];
  let text = null, lastErr = null;
  for (const p of proxies) {
    try {
      const r = await fetch(p);
      if (r.ok) { text = await r.text(); break; }
      lastErr = `HTTP ${r.status}`;
    } catch (e) { lastErr = e.message; }
  }
  if (!text) { status.textContent = '加载失败：' + (lastErr || '未知错误，可能是 CORS 限制'); status.className = 'ics-status err'; return; }

  try {
    const jcal = ICAL.parse(text);
    const comp = new ICAL.Component(jcal);
    const vevents = comp.getAllSubcomponents('vevent');
    const parsed = vevents.map(v => {
      const e = new ICAL.Event(v);
      return {
        id: 'ics_' + (e.uid || uuid()),
        title: e.summary || '(无标题)',
        start: e.startDate.toJSDate().toISOString(),
        end: e.endDate.toJSDate().toISOString(),
        source: 'ics'
      };
    });
    save(STORE.ics, url);
    save('sched.icsCache', parsed);
    state.events = mergeEvents(parsed, load(STORE.customEvents, []));
    status.textContent = `已加载 ${parsed.length} 条事项`; status.className = 'ics-status ok';
    const b = document.getElementById('icsBadge'); if (b) b.textContent = `· ${parsed.length} 条`;
    renderEvents();
  } catch (e) {
    status.textContent = '解析失败：' + e.message; status.className = 'ics-status err';
  }
}

function mergeEvents(ics, custom) {
  return [...ics, ...custom];
}

document.getElementById('loadIcs').onclick = () => {
  const url = document.getElementById('icsUrl').value.trim();
  loadICS(url);
};
document.getElementById('clearIcs').onclick = () => {
  document.getElementById('icsUrl').value = '';
  localStorage.removeItem(STORE.ics);
  localStorage.removeItem('sched.icsCache');
  state.events = load(STORE.customEvents, []);
  document.getElementById('icsStatus').textContent = '已清除';
  renderEvents();
};
document.getElementById('refreshBtn').onclick = () => {
  const u = load(STORE.ics, '');
  if (u) loadICS(u);
  else flash('未设置订阅链接');
};

/* ============ Mobile panels ============ */
function openPanel(id) { document.getElementById(id).classList.add('open'); }
function closePanel(id) { document.getElementById(id).classList.remove('open'); }
window.openPanel = openPanel;
window.closePanel = closePanel;

document.getElementById('fabAdd').onclick = () => {
  const now = new Date();
  const startMin = isSameDay(now, state.date) ? Math.floor((now.getHours()*60 + now.getMinutes()) / 15) * 15 : 9 * 60;
  createEventAt(startMin);
};
document.getElementById('addBtn').onclick = () => {
  const now = new Date();
  const startMin = isSameDay(now, state.date) ? Math.floor((now.getHours()*60 + now.getMinutes()) / 15) * 15 : 9 * 60;
  createEventAt(startMin);
};

/* ============ Auto-scroll to current hour ============ */
function scrollToNow() {
  const HOUR_H = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hour-h'));
  const t = document.getElementById('timeline');
  const now = new Date();
  const top = (now.getHours() - 1) * HOUR_H;
  t.scrollTop = Math.max(top, 0);
}

/* ============ Init ============ */
function init() {
  renderCategories();
  renderDetailCategorySelect();
  updateDateDisplay();
  renderGrid();

  const cached = load('sched.icsCache', []);
  const customEvents = load(STORE.customEvents, []);
  state.events = mergeEvents(cached, customEvents);
  renderEvents();

  const savedUrl = load(STORE.ics, '');
  if (savedUrl) {
    document.getElementById('icsUrl').value = savedUrl;
    loadICS(savedUrl);
  }

  scrollToNow();
  setInterval(() => {
    renderNowLine();
    if (!state.selectedId) renderDashboard();
    else {
      const ev = state.events.find(e => e.id === state.selectedId);
      if (ev) {
        const st = autoStatus(ev);
        const stEl = document.getElementById('dStatusAuto');
        if (stEl) stEl.innerHTML = `<span class="status-pill" data-status="${st.key}"><span class="pill-dot"></span>${st.label}</span>`;
      }
    }
  }, 60000);
}
init();
</script>
